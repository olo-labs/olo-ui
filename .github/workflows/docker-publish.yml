# Build and push combined olo-ui image (olo-be + studio UI) to Docker Hub (+ GHCR)
# Repo secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
# Pull: docker pull <DOCKERHUB_USERNAME>/olo-ui:0.0.1-SNAPSHOT
name: Publish Docker image

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      push:
        description: 'Push image to registry'
        required: false
        default: true
        type: boolean

env:
  GHCR_REGISTRY: ghcr.io
  IMAGE_NAME: olo-ui

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Verify Docker Hub secrets
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.push
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Add repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN to publish to Docker Hub."
            exit 1
          fi
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Checkout olo-ui
        uses: actions/checkout@v4

      - name: Checkout olo-mono (extension catalog)
        uses: actions/checkout@v4
        with:
          repository: olo-labs/olo-mono
          path: olo-mono
          sparse-checkout: |
            gradle
            olo-spi
            olo-annotation
            olo-annotation-processor
            olo-definition
            olo-workflow-input
            olo-bootstrap
            olo-kernel-context
            olo-kernel
            olo-core
          sparse-checkout-cone-mode: true

      - name: Set up Java 21 (olo-core catalog export)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and embed extension catalog
        run: |
          set -eux
          GRADLE_INIT="$GITHUB_WORKSPACE/scripts/olo-mono-ci.init.gradle"
          GRADLE_FLAGS=(-I "$GRADLE_INIT" --no-daemon -x test)
          for script in olo-mono/olo-spi/gradlew olo-mono/olo-annotation/gradlew \
            olo-mono/olo-annotation-processor/gradlew olo-mono/olo-definition/gradlew \
            olo-mono/olo-workflow-input/gradlew olo-mono/olo-bootstrap/gradlew \
            olo-mono/olo-kernel-context/gradlew olo-mono/olo-kernel/gradlew \
            olo-mono/olo-core/gradlew; do
            chmod +x "$script"
          done
          publish() {
            local module="$1"
            shift
            local task="publishMavenPublicationToOloMonoRepository"
            if [ $# -gt 0 ]; then
              task="$1"
            fi
            echo "Publishing $module to olo-mono/build/repo ..."
            (cd "olo-mono/$module" && ./gradlew "${GRADLE_FLAGS[@]}" \
              -PoloPublishBuildDir=../build/publish-work/"$module" \
              "$task")
          }
          for module in olo-spi olo-annotation olo-annotation-processor; do
            publish "$module"
          done
          publish olo-definition :olo-definition:publishMavenPublicationToOloMonoRepository
          for module in olo-workflow-input olo-bootstrap olo-kernel-context; do
            publish "$module"
          done
          test -f olo-mono/build/repo/org/olo/olo-spi/0.1.0-SNAPSHOT/maven-metadata.xml
          test -f olo-mono/build/repo/org/olo/olo-annotation/0.1.0-SNAPSHOT/maven-metadata.xml
          test -f olo-mono/build/repo/org/olo/olo-definition/0.1.0-SNAPSHOT/maven-metadata.xml
          test -f olo-mono/build/repo/org/olo/olo-workflow-input/0.1.0-SNAPSHOT/maven-metadata.xml
          test -f olo-mono/build/repo/org/olo/olo-bootstrap/0.1.0-SNAPSHOT/maven-metadata.xml
          test -f olo-mono/build/repo/org/olo/olo-kernel-context/0.1.0-SNAPSHOT/maven-metadata.xml
          cd olo-mono/olo-core
          ./gradlew "${GRADLE_FLAGS[@]}" dist
          mkdir -p "$GITHUB_WORKSPACE/olo-be/src/main/resources/static/catalog"
          cp dist/catalog/*.json "$GITHUB_WORKSPACE/olo-be/src/main/resources/static/catalog/"
          test -f "$GITHUB_WORKSPACE/olo-be/src/main/resources/static/catalog/catalog.json"

      - name: Resolve library version
        id: version
        run: |
          LIB_VERSION=$(sed -n "s/^version = ['\"]\\(.*\\)['\"]/\\1/p" olo-be/build.gradle | head -1)
          if [ -z "$LIB_VERSION" ]; then
            echo "::error::Could not read version from olo-be/build.gradle"
            exit 1
          fi
          echo "id=$LIB_VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing with library version: $LIB_VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.push
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.push
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (Docker Hub)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.push
        id: meta-dockerhub
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.id }}
            type=raw,value=latest

      - name: Docker metadata (GHCR)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.push
        id: meta-ghcr
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.id }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.push }}
          tags: |
            ${{ steps.meta-dockerhub.outputs.tags }}
            ${{ steps.meta-ghcr.outputs.tags }}
          labels: ${{ steps.meta-dockerhub.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
