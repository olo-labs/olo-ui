server.port=8082
spring.application.name=olo-be

# Redis: worker refresh + optional tenant list (olo-docker dev: localhost:46379).
spring.data.redis.host=localhost
spring.data.redis.port=46379

# Set OLO_DISABLE_REDIS=1 or exclude RedisAutoConfiguration to use in-memory tenants only.

# Tenant list Redis key: set env OLO_TENANT_IDS (e.g. olo:tenants); default olo:tenants if unset.
# olo.tenant.ids=olo:tenants

# Redis key written by POST /api/v1/system/refresh; olo-worker polls this key to reload queues.
olo.worker.refresh-key=olo:worker:refresh

# Olo chat/runtime backend (pipeline profiles, chat context). Used by POST /api/v1/system/refresh.
olo.runtime.base-url=http://localhost:7080

# Active pipeline definitions (place workflow JSON here manually)
olo.configuration.directory=../../olo-mono/olo-definition/olo-configuration/current-active
